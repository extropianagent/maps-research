[project]
name = "maps-research"
version = "0.1.0"
description = "Personal Google Maps research toolkit: CLI-first, provider-agnostic, free-first."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
semantic = ["fastembed>=0.5"]

[project.scripts]
maps = "maps.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mcp>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maps"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
